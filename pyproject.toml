[project]
name = "di-monitor"
version = "0.2.0"
description = "Hold-time alarm on a Doovit digital input, with optional arming from a second input"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.6",
]

[project.scripts]
doover-app-run = "di_monitor:main"
export-config = "di_monitor.app_config:export"
export-ui = "di_monitor.app_ui:export"
export-notifications = "di_monitor.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/di_monitor"]

[dependency-groups]
dev = [
    # The device base image carries these system-wide; locally they come here.
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
